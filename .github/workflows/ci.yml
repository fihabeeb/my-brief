name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # tray_manager -> nativeapi -> cnativeapi declares a native-asset build
      # hook. `flutter test` builds native assets for the Linux host, which
      # needs GTK3/X11/Xi dev headers. The Android APK build uses the NDK and
      # does not need these, but the test step runs first on this runner.
      - name: Install Linux native build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev libx11-dev libxi-dev liblzma-dev
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # SUPABASE_URL / SUPABASE_ANON_KEY are compile-time dart-defines. When the
      # repository secrets are absent the file still contains empty strings, so
      # the build succeeds and ships unconfigured (Setup screen) - just loudly.
      - name: Write Supabase dart-define file
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          mkdir -p config
          printf '{"SUPABASE_URL":"%s","SUPABASE_ANON_KEY":"%s"}' \
            "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > config/ci.json
          if [ -z "$SUPABASE_URL" ]; then
            echo "::warning::SUPABASE_URL / SUPABASE_ANON_KEY secrets not set - this APK will open on the Setup screen."
          else
            echo "Configured artifact for $SUPABASE_URL"
          fi
      - run: flutter build apk --dart-define-from-file=config/ci.json
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Write Supabase dart-define file
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          mkdir -p config
          printf '{"SUPABASE_URL":"%s","SUPABASE_ANON_KEY":"%s"}' \
            "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > config/ci.json
          if [ -z "$SUPABASE_URL" ]; then
            echo "::warning::SUPABASE_URL / SUPABASE_ANON_KEY secrets not set - this exe will open on the Setup screen."
          else
            echo "Configured artifact for $SUPABASE_URL"
          fi
      - run: flutter build windows --dart-define-from-file=config/ci.json
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: build/windows/x64/runner/Release/
